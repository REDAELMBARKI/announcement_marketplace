            MDEwMTg0NTAwWhcNMjkxMTAxMTcwMDAwWjCBkDELMAkGA1UEBhMCVVMxGTAXBgNV
            BAoTEENsb3VkRmxhcmUsIEluYy4xFDASBgNVBAsTC09yaWdpbiBQdWxsMRYwFAYD
            VQQHEw1TYW4gRnJhbmNpc2NvMRMwEQYDVQQIEwpDYWxpZm9ybmlhMSMwIQYDVQQD
            ExpvcmlnaW4tcHVsbC5jbG91ZGZsYXJlLm5ldDCCAiIwDQYJKoZIhvcNAQEBBQAD
            ggIPADCCAgoCggIBAN2y2zojYfl0bKfhp0AJBFeV+jQqbCw3sHmvEPwLmqDLqynI
            42tZXR5y914ZB9ZrwbL/K5O46exd/LujJnV2b3dzcx5rtiQzso0xzljqbnbQT20e
            ihx/WrF4OkZKydZzsdaJsWAPuplDH5P7J82q3re88jQdgE5hqjqFZ3clCG7lxoBw
            hLaazm3NJJlUfzdk97ouRvnFGAuXd5cQVx8jYOOeU60sWqmMe4QHdOvpqB91bJoY
            QSKVFjUgHeTpN8tNpKJfb9LIn3pun3bC9NKNHtRKMNX3Kl/sAPq7q/AlndvA2Kw3
            Dkum2mHQUGdzVHqcOgea9BGjLK2h7SuX93zTWL02u799dr6Xkrad/WShHchfjjRn
            aL35niJUDr02YJtPgxWObsrfOU63B8juLUphW/4BOjjJyAG5l9j1//aUGEi/sEe5
            lqVv0P78QrxoxR+MMXiJwQab5FB8TG/ac6mRHgF9CmkX90uaRh+OC07XjTdfSKGR
            PpM9hB2ZhLol/nf8qmoLdoD5HvODZuKu2+muKeVHXgw2/A6wM7OwrinxZiyBk5Hh
            CvaADH7PZpU6z/zv5NU5HSvXiKtCzFuDu4/Zfi34RfHXeCUfHAb4KfNRXJwMsxUa
            +4ZpSAX2G6RnGU5meuXpU5/V+DQJp/e69XyyY6RXDoMywaEFlIlXBqjRRA2pAgMB
            AAGjZjBkMA4GA1UdDwEB/wQEAwIBBjASBgNVHRMBAf8ECDAGAQH/AgECMB0GA1Ud
            DgQWBBRDWUsraYuA4REzalfNVzjann3F6zAfBgNVHSMEGDAWgBRDWUsraYuA4REz
            alfNVzjann3F6zANBgkqhkiG9w0BAQ0FAAOCAgEAkQ+T9nqcSlAuW/90DeYmQOW1
            QhqOor5psBEGvxbNGV2hdLJY8h6QUq48BCevcMChg/L1CkznBNI40i3/6heDn3IS
            zVEwXKf34pPFCACWVMZxbQjkNRTiH8iRur9EsaNQ5oXCPJkhwg2+IFyoPAAYURoX
            VcI9SCDUa45clmYHJ/XYwV1icGVI8/9b2JUqklnOTa5tugwIUi5sTfipNcJXHhgz
            6BKYDl0/UP0lLKbsUETXeTGDiDpxZYIgbcFrRDDkHC6BSvdWVEiH5b9mH2BON60z
            0O0j8EEKTwi9jnafVtZQXP/D8yoVowdFDjXcKkOPF/1gIh9qrFR6GdoPVgB3SkLc
            5ulBqZaCHm563jsvWb/kXJnlFxW+1bsO9BDD6DweBcGdNurgmH625wBXksSdD7y/
            fakk8DagjbjKShYlPEFOAqEcliwjF45eabL0t27MJV61O/jHzHL3dknXeE4BDa2j
            bA+JbyJeUMtU7KMsxvx82RmhqBEJJDBCJ3scVptvhDMRrtqDBW5JShxoAOcpFQGm
            iYWicn46nPDjgTU0bX1ZPpTpryXbvciVL5RkVBuyX2ntcOLDPlZWgxZCBp96x07F
            AnOzKgZk4RzZPNAxCXERVxajn/FLcOhglVAKo5H0ac+AitlQ0ip55D2/mf8o72tM
            fVQ6VpyjEXdiIXWUq/o=
            -----END CERTIFICATE-----
            CF_CA_EOF

            chmod 600 cert.pem privkey.pem
            chmod 644 cloudflare-origin-pull-ca.pem
            ls -la .
            cd ..

            docker compose -f docker-compose.prod.yml down || true
            docker system prune -af || true
            docker builder prune -af || true
            docker rm -f announcement-backend-prod announcement-frontend-prod announcement-db-prod 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull

            echo "Starting full stack (db -> backend -> frontend)..."
            docker compose -f docker-compose.prod.yml up -d --pull always --remove-orphans

            echo "Waiting for frontend container to pass healthcheck (max 90s)..."
            FRONTEND_OK=0
            for i in $(seq 1 18); do
              STATE=$(docker inspect --format='{{.State.Health.Status}}' announcement-frontend-prod 2>/dev/null || echo "unknown")
              echo "  attempt $i/18: frontend health=$STATE"
              if [ "$STATE" = "healthy" ]; then
                FRONTEND_OK=1
                break
              fi
              if [ "$STATE" = "unhealthy" ] || [ "$STATE" = "exited" ]; then
                echo "  -> frontend entered state=$STATE, dumping logs for diagnosis:"
                docker logs --tail 80 announcement-frontend-prod || true
                echo "  -> backend logs (tail 40):"
                docker logs --tail 40 announcement-backend-prod || true
                break
              fi
              sleep 5
            done

            if [ "$FRONTEND_OK" != "1" ]; then
              echo "ERROR: frontend did not become healthy. Dumping all container state:"
              docker ps -a || true
              echo "--- frontend logs (tail 100) ---"
              docker logs --tail 100 announcement-frontend-prod || true
              echo "--- backend logs (tail 60) ---"
              docker logs --tail 60 announcement-backend-prod || true
              echo "--- db logs (tail 40) ---"
              docker logs --tail 40 announcement-db-prod || true
              exit 1
            fi

            echo "Verifying nginx config + reloading..."
            docker compose -f docker-compose.prod.yml exec -T frontend nginx -t
            docker compose -f docker-compose.prod.yml exec -T frontend nginx -s reload || true

            if [ "$CERT_WROTE" = "1" ]; then
              echo "Deploy finished successfully — Cloudflare origin cert installed."
            else
              echo "Deploy finished successfully — running with SELF-SIGNED DUMMY origin cert."
              echo "  ACTION: In Cloudflare (SSL/TLS -> Origin Server -> Create Certificate) paste cert+key into GitHub Secrets CF_ORIGIN_CERT_PEM + CF_ORIGIN_PRIVKEY_PEM, then re-deploy to install real origin cert."
              echo "  Until then: in Cloudflare you can set SSL/TLS mode = 'Flexible' temporarily (not recommended long-term), then switch to 'Full (strict)' after real origin cert is installed."
            fi
            echo "Domain: https://letsbeus.online"