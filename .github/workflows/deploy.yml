name: "CI/CD Pipeline"

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Build and deploy to AWS"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build images"
        run: docker compose -f docker-compose.yml build

      - name: "Push images to Docker Hub"
        run: docker compose -f docker-compose.yml push

      - name: "Verify required deploy files exist on runner"
        run: |
          set -euo pipefail
          echo "--- pwd ---" && pwd
          echo "--- ls -la ---" && ls -la
          echo "--- required files ---"
          ls -l docker-compose.prod.yml

      - name: "Upload docker-compose.prod.yml to server"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          rm: false
          source: "docker-compose.prod.yml"
          target: "~"
          strip_components: 0
          overwrite: true

      - name: "SSH to server and deploy"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            # ── Origin cert / key from GitHub Secrets ────────────────────────
            # Set these 2 secrets in the repo:
            #   CF_ORIGIN_CERT_PEM       (-----BEGIN CERTIFICATE-----…-----END CERTIFICATE-----)
            #   CF_ORIGIN_PRIVKEY_PEM    (-----BEGIN PRIVATE KEY-----…-----END PRIVATE KEY-----)
            # If either is empty we fall back to a self-signed dummy cert so
            # nginx can still boot — Cloudflare Full / Full (strict) will then
            # fail until you set the real origin cert (browsers never see it).
            CF_CERT="${{ secrets.CF_ORIGIN_CERT_PEM }}"
            CF_KEY="${{ secrets.CF_ORIGIN_PRIVKEY_PEM }}"

            export DB_DATABASE="${{ secrets.DB_DATABASE }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"

            # ── Prepare cloudflare-origin dir on the host ────────────────────
            sudo mkdir -p cloudflare-origin
            sudo chown -R "$(id -u):$(id -g)" cloudflare-origin
            chmod 700 cloudflare-origin

            # ── Write cert + key or fall back to self-signed dummy ──────────
            cd cloudflare-origin || exit 1
            CERT_WROTE=0
            if [ -n "$CF_CERT" ] && [ -n "$CF_KEY" ]; then
              echo "Using Cloudflare origin cert from GitHub Secrets"
              printf '%s\n' "$CF_CERT" > cert.pem
              printf '%s\n' "$CF_KEY"  > privkey.pem
              CERT_WROTE=1
            else
              echo "CF_ORIGIN_CERT_PEM / CF_ORIGIN_PRIVKEY_PEM not set → generating self-signed dummy cert so nginx can boot."
              echo "  -> Generate real cert in Cloudflare (SSL/TLS → Origin Server → Create Certificate) and set the 2 secrets; then re-deploy."
              openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
                -keyout privkey.pem -out cert.pem \
                -subj "/CN=letsbeus.online/O=Self-Signed-Origin-Dummy/C=US" >/dev/null 2>&1
            fi

            # Write Cloudflare's public Origin Pull CA (required by ssl_client_certificate in nginx.conf).
            # This is public, non-sensitive data — source:
            # https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/set-up/zone-level/#upload-the-certificate-to-your-origin
            cat > cloudflare-origin-pull-ca.pem <<'CF_CA_EOF'
            -----BEGIN CERTIFICATE-----
            MIIGCjCCA/KgAwIBAgIIV5G6lVbCLmEwDQYJKoZIhvcNAQENBQAwgZAxCzAJBgNV
            BAYTAlVTMRkwFwYDVQQKExBDbG91ZEZsYXJlLCBJbmMuMRQwEgYDVQQLEwtPcmln
