name: "CI/CD Pipeline"

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Build and deploy to AWS"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build images"
        run: docker compose -f docker-compose.yml build

      - name: "Push images to Docker Hub"
        run: docker compose -f docker-compose.yml push

      - name: "SSH to server and deploy"
        uses: appleboy/ssh-action@v1.0.3  
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            curl -fsSL -H 'Cache-Control: no-cache' -O "https://raw.githubusercontent.com/REDAELMBARKI/announcement_marketplace/main/docker-compose.prod.yml?v=$(date +%s)"
            curl -fsSL -H 'Cache-Control: no-cache' -O "https://raw.githubusercontent.com/REDAELMBARKI/announcement_marketplace/main/init-letsencrypt.sh?v=$(date +%s)"
            export DB_DATABASE="${{ secrets.DB_DATABASE }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"
            docker compose -f docker-compose.prod.yml down
            docker system prune -af
            docker builder prune -af
            docker rm -f announcement-backend-prod || true
            docker rm -f announcement-frontend-prod || true
            docker compose -f docker-compose.prod.yml up -d --pull always --remove-orphans
            
            # Run SSL setup if certificates don't exist
            if [ ! -d "certbot/conf/live/letsbeus.duckdns.org" ]; then
              echo "Setting up SSL certificates..."
              chmod +x init-letsencrypt.sh
              sed -i 's/your-email@example.com/${{ secrets.SSL_EMAIL }}/g' init-letsencrypt.sh
              ./init-letsencrypt.sh
            else
              echo "SSL certificates already exist, skipping setup"
            fi