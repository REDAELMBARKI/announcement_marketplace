name: "CI/CD Pipeline"

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Build and deploy"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build images"
        run: docker compose -f docker-compose.yml build

      - name: "Push images to Docker Hub"
        run: docker compose -f docker-compose.yml push

      - name: "Upload docker-compose.prod.yml to server"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "~"
          overwrite: true

      - name: "Deploy on server"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: DB_DATABASE,DB_USERNAME,DB_PASSWORD,MYSQL_ROOT_PASSWORD
          script: |
            set -euo pipefail
            cd ~
            SUDO=""
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              SUDO="sudo -n"
            fi

            docker system prune -af --volumes

            if command -v ctr >/dev/null 2>&1 && [ -n "$SUDO" ]; then
              $SUDO ctr -n moby snapshots ls | awk '/extract-/ {print $1}' | xargs -r -n1 $SUDO ctr -n moby snapshots rm || true
            fi

            if command -v journalctl >/dev/null 2>&1 && [ -n "$SUDO" ]; then
              $SUDO journalctl --vacuum-time=2d || true
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            sleep 10
            docker compose -f docker-compose.prod.yml ps
            echo "Deploy finished. Domain: https://letsbeus.online"
