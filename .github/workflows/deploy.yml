name: "CI/CD Pipeline"

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Build and deploy to AWS"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build and push images"
        run: docker compose -f docker-compose.yml build --push

      - name: "SSH to server and deploy"
        uses: appleboy/ssh-action@v1.0.3  
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            curl -fsSL -O https://raw.githubusercontent.com/REDAELMBARKI/announcement_marketplace/main/docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml down
            docker rm -f announcement-backend-prod || true
            docker rm -f announcement-frontend-prod || true
            docker compose -f docker-compose.prod.yml up -d --pull always --remove-orphans