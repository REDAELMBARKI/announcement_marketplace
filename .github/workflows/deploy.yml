name: "CI/CD Pipeline"

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Build and deploy to AWS"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build images"
        run: docker compose -f docker-compose.yml build

      - name: "Push images to Docker Hub"
        run: docker compose -f docker-compose.yml push

      - name: "SSH to server and deploy"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            curl -fsSL -H 'Cache-Control: no-cache' -O "https://raw.githubusercontent.com/REDAELMBARKI/announcement_marketplace/main/docker-compose.prod.yml?v=$(date +%s)"
            curl -fsSL -H 'Cache-Control: no-cache' -O "https://raw.githubusercontent.com/REDAELMBARKI/announcement_marketplace/main/init-letsencrypt.sh?v=$(date +%s)"
            mkdir -p certbot-dynu certbot/conf certbot/www
            # Ensure these dirs are writable by our user (prior runs may have left them root-owned)
            sudo -n chown -R "$(id -u):$(id -g)" certbot certbot-dynu 2>/dev/null || true
            chmod -R u+rwX certbot certbot-dynu 2>/dev/null || true

            curl -fsSL -H 'Cache-Control: no-cache' -o certbot-dynu/authenticator.sh "https://raw.githubusercontent.com/REDAELMBARKI/announcement_marketplace/main/certbot-dynu/authenticator.sh?v=$(date +%s)"
            curl -fsSL -H 'Cache-Control: no-cache' -o certbot-dynu/cleanup.sh "https://raw.githubusercontent.com/REDAELMBARKI/announcement_marketplace/main/certbot-dynu/cleanup.sh?v=$(date +%s)"
            chmod +x init-letsencrypt.sh certbot-dynu/authenticator.sh certbot-dynu/cleanup.sh

            export DB_DATABASE="${{ secrets.DB_DATABASE }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"
            export DYNU_API_KEY="${{ secrets.DYNU_API_KEY }}"

            docker compose -f docker-compose.prod.yml down || true
            docker system prune -af || true
            docker builder prune -af || true
            docker rm -f announcement-backend-prod announcement-frontend-prod announcement-certbot announcement-db-prod 2>/dev/null || true
            # After prune, certbot/conf might be re-owned by root if docker recreated it
            sudo -n chown -R "$(id -u):$(id -g)" certbot 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull

            # Run SSL setup FIRST (DNS-01 does not need nginx running)
            if [ ! -d "certbot/conf/live/letsbeus.freeddns.org" ] || [ ! -f "certbot/.ssl-tested" ]; then
              echo "Setting up SSL certificates via DNS-01 (Dynu API)..."

              if [ ! -f "certbot/.ssl-tested" ]; then
                echo "First time setup - testing with staging certificate..."
                sed -i 's/^STAGING=.*/STAGING=1/' init-letsencrypt.sh
                ./init-letsencrypt.sh

                echo "Staging test passed! Cleaning up staging cert and requesting real production certificate..."
                rm -rf certbot/conf/live certbot/conf/archive certbot/conf/renewal
                sed -i 's/^STAGING=.*/STAGING=0/' init-letsencrypt.sh
                ./init-letsencrypt.sh
                touch certbot/.ssl-tested
              else
                echo "certbot/.ssl-tested marker exists, skipping staging→prod cycle"
              fi
            else
              echo "SSL certificates already exist, skipping issuance"
            fi

            # Start the full stack now that certs are in place
            echo "Starting full stack (db → backend → frontend + certbot renew loop)..."
            docker compose -f docker-compose.prod.yml up -d --pull always --remove-orphans

            # Final nginx reload to ensure the new cert is active (idempotent, safe)
            echo "Reloading nginx to activate certificate..."
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T frontend nginx -t
            docker compose -f docker-compose.prod.yml exec -T frontend nginx -s reload || true

            echo "Deploy finished successfully"