version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: announcement-db-prod
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - announcement-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: redaelmbarki/announcement-app-backend:latest
    container_name: announcement-backend-prod
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-storage:/var/www/html/storage/app
      - backend-logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - WWWGROUP=1000
      - APP_URL=${APP_URL:-https://letsbeus.freeddns.org}
      - FRONTEND_URL=${FRONTEND_URL:-https://letsbeus.freeddns.org}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-letsbeus.freeddns.org}
    networks:
      - announcement-network
    restart: unless-stopped

  frontend:
    image: redaelmbarki/announcement-app-frontend:latest
    container_name: announcement-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - announcement-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: announcement-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot-dynu:/etc/letsencrypt/hooks:ro
    environment:
      - DYNU_API_KEY=${DYNU_API_KEY}
    entrypoint: "/bin/sh -c 'trap exit TERM; apk add --no-cache curl python3 >/dev/null 2>&1; chmod +x /etc/letsencrypt/hooks/authenticator.sh /etc/letsencrypt/hooks/cleanup.sh; while :; do certbot renew -q --manual-auth-hook /etc/letsencrypt/hooks/authenticator.sh --manual-cleanup-hook /etc/letsencrypt/hooks/cleanup.sh --manual-public-ip-logging-ok --non-interactive --deploy-hook \"echo Reloading skipped, nginx reload handled separately\"; sleep 12h & wait $${!}; done;'"
    networks:
      - announcement-network

networks:
  announcement-network:
    driver: bridge

volumes:
  backend-storage:
  backend-logs:
  mysql-data:
