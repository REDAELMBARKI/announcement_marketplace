version: '3.8'

services:
  backend:
    image: redaelmbarki/announcement-app-backend:latest
    # build : ./backend
    container_name: announcement-backend-prod
    ports:
      - "8000:80"
    volumes:
      - backend-storage:/var/www/html/storage/app
      - backend-logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - WWWGROUP=1000
      - APP_URL=http://13.60.219.215
      - FRONTEND_URL=http://13.60.219.215,http://localhost
      - SANCTUM_STATEFUL_DOMAINS=13.60.219.215,localhost
    networks:
      - announcement-network
    restart: unless-stopped

  frontend:
    image: redaelmbarki/announcement-app-frontend:latest
    # build: ./frontend
    container_name: announcement-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - announcement-network
    restart: unless-stopped

networks:
  announcement-network:
    driver: bridge

volumes:
  backend-storage:
  backend-logs:
