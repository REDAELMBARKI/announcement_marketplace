# HTTP Server - Redirect everything to HTTPS
server {
    listen 80;
    server_name letsbeus.online;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name letsbeus.online;

    root /usr/share/nginx/html;
    index index.html;

    # ── Cloudflare Origin Certificate (Full / Full (strict) mode) ──────────
    # Generated in Cloudflare dashboard: SSL/TLS → Origin Server → Create Certificate.
    # Mounted read-only into the container via docker-compose.prod.yml bind mount:
    #   ./cloudflare-origin/ (host) -> /etc/cloudflare-origin/ (container)
    ssl_certificate     /etc/cloudflare-origin/cert.pem;
    ssl_certificate_key /etc/cloudflare-origin/privkey.pem;

    # ── TLS Security Settings ──────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Cloudflare Authenticated Origin Pulls (defense-in-depth) ───────────
    # Require that any client connecting to port 443 on the origin presents a
    # TLS client certificate signed by Cloudflare's Origin Pull CA. This means
    # ONLY Cloudflare's edge servers can reach your origin directly — even if
    # someone finds the origin server's public IP, they get a 400 handshake
    # error.
    #
    # INSTRUCTIONS TO ENABLE (do this AFTER you confirm the site loads via CF):
    #   1. Cloudflare dashboard → SSL/TLS → Origin Server →
    #      Authenticated Origin Pulls → set zone-level switch to ON.
    #   2. In this file, below, change `ssl_verify_client optional_no_ca;`
    #      → `ssl_verify_client on;`
    #      and UN-comment the `if ($ssl_client_verify != SUCCESS) return 444;` block.
    #
    # For now we keep it informational: the CA is loaded, CF's client cert will
    # be accepted, but we don't block non-CF clients (so you can still curl
    # origin IP directly for debugging and nginx doesn't self-sabotage on boot).
    ssl_client_certificate /etc/cloudflare-origin/cloudflare-origin-pull-ca.pem;
    ssl_verify_client optional_no_ca;
    #
    # UNCOMMENT THESE TWO LINES ONLY AFTER Cloudflare AOP is ON in dashboard:
    # if ($ssl_client_verify != SUCCESS) {
    #     return 444;
    # }

    # Real client IP comes via CF headers (orange-cloud proxy).
    # Trust only Cloudflare's public edge ranges for X-Forwarded-For / CF-Connecting-IP:
    #   https://www.cloudflare.com/ips/  (retrieved 2025-01-20, update periodically).
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Serve Frontend React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container in docker network
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Ray $http_cf_ray;
    }

    # Proxy uploaded storage media requests to backend
    location /storage/ {
        proxy_pass http://backend:80/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}
